<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixelStudio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>PixelStudio</h1>
    <div id="toolbar">
        <input type="color" id="colorPicker" value="#000000" title="Kleur kiezen">
        <button id="penBtn" class="tool-btn active">Pen</button>
        <button id="eraserBtn" class="tool-btn">Gum</button>
        <button id="clearBtn">Wis alles</button>
        <button id="exportBtn">Opslaan als PNG</button>
        <select id="gridSize" title="Grid grootte">
            <option value="16">16×16</option>
            <option value="32">32×32</option>
            <option value="8">8×8</option>
        </select>
    </div>
    <canvas id="PixelCanvas"></canvas>

    <script src="js/Pixel.js"></script>
    <script src="js/Grid.js"></script>
    <script src="js/Tool.js"></script>
    <script src="js/app.js"></script>
    <script src="main.js"></script>
</body>
</html>
